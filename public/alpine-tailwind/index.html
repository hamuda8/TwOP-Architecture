<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TwOP Architecture - Alpine + Tailwind</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      content: ['./index.html'],
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6'
          }
        }
      }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">

  <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Alpine + Tailwind SPA</h1>

    <div class="api-status mb-4 p-4 bg-gray-50 rounded">
      <p id="message" class="text-gray-600">Loading...</p>
    </div>

    <button 
      id="loadApiBtn" 
      class="btn-primary w-full py-2 px-4 rounded-md font-medium text-blue-600 hover:bg-blue-100 transition-colors"
    >
      Load from /api/hello
    </button>
  </div>

  <script defer src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@3.14.0/dist/cdn.js"></script>
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('apiApp', () => ({
        message: '',
        loadApi: async function() {
          try {
            const res = await fetch('/api/hello')
            const data = await res.json()
            this.message = data.message
          } catch (e) {
            this.message = 'Error loading API'
          }
        }
      }))
      Alpine.store('apiStore', {
        message: '',
        load: async function() {
          const res = await fetch('/api/hello')
          const data = await res.json()
          apiStore.message = data.message
        }
      })
    })
    
    // Initial fetch
    fetch('/api/hello').then(res => res.json()).then(data => {
      document.getElementById('message').textContent = data.message
    })
  </script>
</body>
</html>
